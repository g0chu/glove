# Glove tool sidecars (see tools/ for the code).
#
# Both containers bind to 127.0.0.1 only: they are meant to be reached by
# the bot on this host, never from the network. The filetools container
# lives behind the "files" compose profile and keeps its data in ./workspace
# (gitignored, survives container restarts and rebuilds).
#
#   docker compose build
#   docker compose up -d webtools              # web search + fetch  (:8377)
#   docker compose --profile files up -d       # + file workspace    (:8378)

services:
  webtools:
    build: ./tools
    image: glove-webtools:latest
    container_name: glove-webtools
    environment:
      ROLE: webtools
      HOST: 0.0.0.0
      PORT: "8377"
      TMPDIR: /tmp
    ports:
      - "127.0.0.1:8377:8377"
    read_only: true
    tmpfs:
      - /tmp:size=256m
      - /home/glove:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1536m
          cpus: "2"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8377/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  filetools:
    build: ./tools
    image: glove-webtools:latest
    container_name: glove-filetools
    profiles:
      - files
    environment:
      ROLE: filetools
      HOST: 0.0.0.0
      PORT: "8378"
      WORKSPACE_DIR: /workspace
    volumes:
      - ./workspace:/workspace
    ports:
      - "127.0.0.1:8378:8378"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8378/health', timeout=5).status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
